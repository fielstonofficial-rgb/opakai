<!doctype html>
<html lang="ja">
<head>
<!-- opa-game v1 2026-10-30 段階1：ひとり採掘＋図鑑（無料・景品なし） -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>オパール採掘</title>
<style>
:root{--bg:#0a1216;--bg2:#13222a;--ink:#f3efe6;--mut:#9db0b8;--gold:#e8c46a;--line:rgba(255,255,255,.14);--n:#8fa3ad;--r:#58a6ff;--sr:#b583ff;--ur:#ffd36a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:radial-gradient(120% 80% at 50% 0%,#1d3a45 0%,var(--bg) 62%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
/* 読み込み */
#load{align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* オープニング */
#open{align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(90% 70% at 50% 40%,#244a58 0%,#0a1216 70%)}
#open .ttl{font-size:clamp(34px,10vw,52px);font-weight:800;letter-spacing:.08em;margin:0;display:flex;gap:2px}
#open .ttl span{opacity:0;transform:translateY(24px) scale(.8);animation:rise .7s cubic-bezier(.2,.9,.3,1.3) forwards;background:linear-gradient(180deg,#fff6d8,#e8c46a 60%,#b98a2e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(232,196,106,.45))}
@keyframes rise{to{opacity:1;transform:none}}
#open .sub{margin:14px 0 0;color:var(--mut);opacity:0;animation:fade 1s 1.7s forwards;font-size:15px}
#open .tap{margin-top:46px;opacity:0;animation:fade .8s 2.4s forwards,pulse 1.6s 3.2s infinite;font-size:17px;padding:14px 30px;border-radius:999px;border:1px solid var(--gold);background:rgba(232,196,106,.12)}
@keyframes fade{to{opacity:1}}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 24px rgba(232,196,106,.45)}}
.hero-gem{width:120px;height:120px;margin-bottom:18px;opacity:0;transform:scale(.3);animation:pop 1s .3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.fl{position:absolute;pointer-events:none;opacity:0;animation:floaty linear infinite}
@keyframes floaty{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:.9}100%{opacity:0;transform:translateY(-120px) scale(1.1) rotate(40deg)}}
#skip{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;background:none;border:0;color:var(--mut);font-size:13px;padding:8px}
/* ヘッダー */
.bar{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.bar h1{flex:1;margin:0;font-size:17px;text-align:center}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:19px;line-height:1}
.ib:active{transform:scale(.94)}
/* キャラ作り */
#make .body{flex:1;overflow:auto;padding:4px 16px 20px}
.prev{display:grid;place-items:center;padding:6px 0 2px}
.prev svg{width:170px;height:204px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.fld{margin:12px 0 6px;font-size:13px;color:var(--mut)}
input.nm{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:14px}
.opt.sel{border-color:var(--gold);background:rgba(232,196,106,.18)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
.foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(10,18,22,.85)}
.big{width:100%;padding:15px;border-radius:16px;border:0;font-size:18px;font-weight:700;color:#2a1f05;background:linear-gradient(180deg,#ffe9a8,#e8c46a 55%,#c99a3c);box-shadow:0 6px 18px -6px rgba(232,196,106,.6)}
.big:active{transform:translateY(1px) scale(.99)}
.big[disabled]{opacity:.5}
.ghost{width:100%;margin-top:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:none;font-size:15px}
/* 採掘 */
#play .scene{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:flex-end;overflow:hidden}
#play .scene::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 52%,rgba(120,200,220,.16),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.35))}
.rockwrap{position:relative;width:min(62vw,300px);aspect-ratio:1;margin:0 3% 6% 0;touch-action:manipulation}
.rockwrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 14px 14px rgba(0,0,0,.5))}
.rockwrap.hit{animation:shake .18s}
@keyframes shake{25%{transform:translate(-5px,2px) rotate(-1.5deg)}75%{transform:translate(5px,-2px) rotate(1.5deg)}}
.hero{position:absolute;left:3%;bottom:5%;width:34%;max-width:150px;pointer-events:none}
.hero svg{width:100%;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.pick{position:absolute;left:24%;bottom:30%;width:22%;max-width:100px;transform-origin:20% 90%;pointer-events:none}
.pick.sw1{animation:swing .26s ease-out}
@keyframes swing{0%{transform:rotate(-8deg)}45%{transform:rotate(-62deg)}100%{transform:rotate(-8deg)}}
.dust{position:absolute;width:7px;height:7px;border-radius:50%;background:#d8e4ea;pointer-events:none;animation:dust .55s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.hud{padding:10px 16px 6px}
.prog{height:14px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fd6ff,#b583ff,#ffd36a);transition:width .12s}
.hint{margin:7px 0 0;font-size:13px;color:var(--mut);text-align:center;min-height:19px}
.stats{display:flex;justify-content:space-around;padding:2px 12px 8px;font-size:13px;color:var(--mut)}
.stats b{color:var(--ink);font-size:16px}
.today{margin:0 16px 8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
.today .g{width:34px;height:34px;flex:none}
/* 石の表示 */
.gem{display:inline-block}
.gem svg{width:100%;height:100%;display:block}
.opal{position:relative;width:100%;height:100%;border-radius:50% 50% 48% 48%/58% 58% 42% 42%;overflow:hidden;clip-path:ellipse(50% 50% at 50% 50%);isolation:isolate;background:var(--b);box-shadow:inset 0 -9px 14px rgba(0,0,0,.4),inset 0 7px 10px rgba(255,255,255,.28),0 4px 10px rgba(0,0,0,.4)}
.opal::before{content:"";position:absolute;inset:-35%;background:conic-gradient(from 0deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));filter:blur(9px);opacity:.88;mix-blend-mode:screen;animation:sp 7s linear infinite}
.opal::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 32% 24%,rgba(255,255,255,.65),transparent 60%),radial-gradient(40% 30% at 70% 80%,var(--c2),transparent 70%);mix-blend-mode:overlay;animation:glint 3.2s ease-in-out infinite}
@keyframes glint{50%{opacity:.55;transform:translateX(6%)}}
.opal.boulder{background:linear-gradient(135deg,#6b4a32,#3e2a1d 60%,#7a5638)}
.opal.boulder::before{inset:12% 8%;border-radius:40% 60% 50% 50%;filter:blur(5px)}
.unk{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.06);color:rgba(255,255,255,.28);font-weight:800;font-size:26px}
/* 重ねる画面 */
.sheet{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;background:rgba(6,12,15,.97)}
.sheet.on{display:flex}
.sheet .body{flex:1;overflow:auto;padding:4px 16px 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;background:rgba(255,255,255,.04);font-size:13px}
.card .gem{width:62px;height:62px;margin:2px auto 6px;display:block}
.card .t{display:block;font-size:11px;margin-bottom:2px}
.card .nm2{font-weight:700;font-size:14px}
.card .cnt{color:var(--mut);font-size:12px}
.card.t3{border-color:rgba(255,211,106,.55);background:linear-gradient(180deg,rgba(255,211,106,.1),transparent)}
.card.t2{border-color:rgba(181,131,255,.5)}
.card.t1{border-color:rgba(88,166,255,.45)}
.tN{color:var(--n)}.tR{color:var(--r)}.tS{color:var(--sr)}.tU{color:var(--ur)}
.sec{margin:16px 0 6px;font-size:13px;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.tg{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.1);position:relative}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:#3fa66a}.tg.on i{left:25px}
/* 掘り当て演出 */
#rev{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(4,8,10,.9)}
#rev.on{display:flex}
#rev .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#rev.f1 .flash{animation:fl .6s ease-out}
#rev.f3 .flash{animation:fl 1.1s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#rev .big-gem{width:min(52vw,210px);height:min(52vw,210px);animation:zoom .8s cubic-bezier(.2,1.3,.4,1) both;filter:drop-shadow(0 0 28px var(--glow,rgba(255,255,255,.4)))}
@keyframes zoom{from{transform:scale(.1) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
#rev .tier{margin:18px 0 2px;font-size:15px;font-weight:800;letter-spacing:.2em}
#rev .name{margin:0;font-size:28px;font-weight:800}
#rev .new{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:#ff5a7a;color:#fff;font-size:12px;vertical-align:middle;animation:pulse 1.2s infinite}
#rev .tri{margin:14px 0 24px;max-width:340px;font-size:14px;line-height:1.7;color:#d6e0e4}
#rev .conf{position:absolute;top:-10px;width:9px;height:14px;opacity:.95;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg);opacity:.8}}
#toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:rgba(0,0,0,.85);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:86%;text-align:center;display:none}
.tiny{font-size:12px;color:var(--mut);line-height:1.6;margin:10px 0}
</style>
</head>
<body>
<div id="app">
  <section class="scr on" id="load"><div class="spin"></div><div id="loadMsg">ほりだし中…</div></section>

  <section class="scr" id="open">
    <button id="skip" type="button">スキップ</button>
    <div class="hero-gem" id="heroGem"></div>
    <h1 class="ttl" id="ttl"></h1>
    <p class="sub">掘って、集めて、図鑑をうめよう</p>
    <button class="tap" id="openGo" type="button">タップして はじめる</button>
  </section>

  <section class="scr" id="make">
    <div class="bar"><button class="ib" id="makeBack" type="button" aria-label="もどる" hidden>←</button><h1 id="makeTtl">キャラをつくろう</h1><span style="width:42px"></span></div>
    <div class="body">
      <div class="prev" id="prev"></div>
      <div class="fld">なまえ（12文字まで）</div>
      <input class="nm" id="nameIn" maxlength="12" autocomplete="off" placeholder="なまえ">
      <div class="fld">髪型</div><div class="opts" id="oHair"></div>
      <div class="fld">髪の色</div><div class="opts" id="oHairC"></div>
      <div class="fld">服</div><div class="opts" id="oOut"></div>
      <div class="fld">服の色</div><div class="opts" id="oOutC"></div>
      <div class="fld">肌の色</div><div class="opts" id="oSkin"></div>
      <p class="tiny">あとから、ゲームの中の「せってい」でいつでも変えられるで。</p>
    </div>
    <div class="foot"><button class="big" id="makeOk" type="button">この子で決定！</button></div>
  </section>

  <section class="scr" id="play">
    <div class="bar">
      <button class="ib" id="close" type="button" aria-label="とじる">✕</button>
      <h1>オパール採掘</h1>
      <button class="ib" id="bookBtn" type="button" aria-label="図鑑">📖</button>
      <button class="ib" id="setBtn" type="button" aria-label="せってい">⚙️</button>
    </div>
    <div class="scene" id="scene">
      <div class="hero" id="hero"></div>
      <div class="pick" id="pick"></div>
      <div class="rockwrap" id="rock"></div>
    </div>
    <div class="hud">
      <div class="prog"><i id="progBar"></i></div>
      <p class="hint" id="hint">岩をたたいてな！</p>
    </div>
    <div class="stats"><span>掘った回数 <b id="sDigs">0</b></span><span>見つけた石 <b id="sKinds">0</b>/<span id="sAll">16</span></span></div>
    <div class="today" id="today"></div>
    <div class="foot"><button class="big" id="dig" type="button">⛏️ 掘る！</button></div>

    <div class="sheet" id="book">
      <div class="bar"><span style="width:42px"></span><h1 id="bookTtl">図鑑</h1><button class="ib" data-close="book" type="button" aria-label="とじる">✕</button></div>
      <div class="body"><div class="grid" id="bookGrid"></div></div>
    </div>
    <div class="sheet" id="set">
      <div class="bar"><span style="width:42px"></span><h1>せってい</h1><button class="ib" data-close="set" type="button" aria-label="とじる">✕</button></div>
      <div class="body">
        <div class="sec">キャラクター</div>
        <div class="row"><span id="setName"></span><button class="opt" id="editAvatar" type="button">キャラを変える</button></div>
        <div class="sec">音と振動</div>
        <div class="row"><span>効果音</span><button class="tg" id="tgSound" type="button" aria-label="効果音"><i></i></button></div>
        <div class="row"><span>振動（スマホ）</span><button class="tg" id="tgVib" type="button" aria-label="振動"><i></i></button></div>
        <p class="tiny">記録は、自動でセーブされます。次に開いた時は、つづきからはじまるで。</p>
      </div>
    </div>
    <div id="rev">
      <div class="flash"></div>
      <div class="big-gem" id="revGem"></div>
      <div class="tier" id="revTier"></div>
      <h2 class="name"><span id="revName"></span><span class="new" id="revNew" hidden>NEW</span></h2>
      <p class="tri" id="revTri"></p>
      <button class="big" id="revOk" type="button" style="max-width:320px">つぎも掘る！</button>
    </div>
  </section>
  <div id="toast"></div>
</div>

<script>
(function () {
  'use strict';
  var API = 'https://fxkahiastkklxduecrhq.supabase.co/functions/v1/opa-game';
  var TAPS = 10;                       // 石1つに必要なたたく回数
  var TIERS = [
    { n: 'ノーマル', c: 'tN', glow: 'rgba(143,163,173,.5)' },
    { n: 'レア', c: 'tR', glow: 'rgba(88,166,255,.7)' },
    { n: '超レア', c: 'tS', glow: 'rgba(181,131,255,.85)' },
    { n: '激レア', c: 'tU', glow: 'rgba(255,211,106,1)' }
  ];
  /* 石の図鑑：t=段階 / f=形 / c=[明,基,暗]  opal:[基,c1,c2,c3,c4] */
  var STONES = [
    { id: 'quartz', t: 0, nm: '水晶', f: 'hex', c: ['#ffffff', '#dfeaf0', '#a9bcc8'], tri: '透明な石英。世界中で見つかる、いちばん身近な結晶やで。' },
    { id: 'amethyst', t: 0, nm: 'アメジスト', f: 'hex', c: ['#e3c8ff', '#a66bdc', '#5f2d92'], tri: '紫色の石英。2月の誕生石として知られてるで。' },
    { id: 'citrine', t: 0, nm: 'シトリン', f: 'hex', c: ['#fff0a8', '#f2b72e', '#b87a0c'], tri: '黄色の石英。明るい色で、運気の石とも言われるで。' },
    { id: 'garnet', t: 0, nm: 'ガーネット', f: 'hex', c: ['#ffb3b3', '#c42b3a', '#6d0f1d'], tri: '深い赤が代表的。1月の誕生石やで。' },
    { id: 'peridot', t: 0, nm: 'ペリドット', f: 'hex', c: ['#ecffb0', '#9acd32', '#4f7a0f'], tri: 'オリーブ色の石。8月の誕生石やで。' },
    { id: 'sapphire', t: 1, nm: 'サファイア', f: 'oct', c: ['#b9d6ff', '#2f63d8', '#112a73'], tri: 'コランダムの仲間で、青がいちばん有名。9月の誕生石やで。' },
    { id: 'emerald', t: 1, nm: 'エメラルド', f: 'oct', c: ['#b6ffd2', '#1fa764', '#0b5b34'], tri: '緑のベリル。5月の誕生石で、内側の細かな模様も味わいやで。' },
    { id: 'ruby', t: 1, nm: 'ルビー', f: 'oct', c: ['#ffc1c8', '#d6203f', '#7a0a22'], tri: 'サファイアと同じコランダムの赤。7月の誕生石やで。' },
    { id: 'diamond', t: 1, nm: 'ダイヤモンド', f: 'dia', c: ['#ffffff', '#d8f2ff', '#8fc3e6'], tri: '天然の物質でいちばん硬い。4月の誕生石やで。' },
    { id: 'paraiba', t: 2, nm: 'パライバトルマリン', f: 'dia', c: ['#c9fff6', '#18d6d0', '#0a6f9a'], tri: 'ネオンのような青緑。1980年代にブラジルのパライバ州で見つかったんや。' },
    { id: 'alexandrite', t: 2, nm: 'アレキサンドライト', f: 'dia', c: ['#d6ffd9', '#3aa57a', '#7a2a6e'], tri: '光によって色が変わる、めずらしい石。昼は青緑、灯りの下では赤紫っぽくなるで。' },
    { id: 'colordiamond', t: 2, nm: 'カラーダイヤ', f: 'dia', c: ['#ffd6f0', '#ff6fb5', '#a5206a'], tri: '色のついた天然ダイヤ。ピンクや黄色は、とくに希少やで。' },
    { id: 'crystalopal', t: 2, nm: 'クリスタルオパール', f: 'opal', o: ['#cfe9ee', '#ff77b0', '#6cf2c8', '#7aa8ff', '#ffe27a'], tri: '透きとおった体色のオパール。向こう側が透けて、遊色が奥から光るんや。' },
    { id: 'boulderopal', t: 3, nm: 'ボルダーオパール', f: 'boulder', o: ['#5a3d28', '#33e0c0', '#3a7bff', '#9a5cff', '#a6ff6b'], tri: '鉄石（母岩）の上に、オパールの層が薄く走る石。クイーンズランドが産地として有名やで。' },
    { id: 'fireopal', t: 3, nm: 'ファイアオパール', f: 'opal', o: ['#e8561c', '#ffb02e', '#ff3b30', '#ffd86b', '#ff7a2e'], tri: 'オレンジから赤の体色。メキシコが有名で、遊色のない石もあるんやで。' },
    { id: 'blackopal', t: 3, nm: 'ブラックオパール', f: 'opal', o: ['#0b0f1e', '#19f0a6', '#3a6bff', '#d23bff', '#2bd4ff'], tri: '暗い体色に、遊色がくっきり映える。オーストラリアのライトニングリッジが産地として有名やで。' }
  ];
  var BY = {}; STONES.forEach(function (s) { BY[s.id] = s; });
  var SKIN = ['#fde3d0', '#f6cfb0', '#ecb98f', '#d9a27a', '#b57a56', '#8a5a3c'];

      if (j._s === 401) { $('loadMsg').textContent = 'オパ会の入り直しが必要みたい。チャットに入ってから開いてな'; document.querySelector('#load .spin').style.display = 'none'; return; }
      nick = j.nickname || '';
      if (j.player) { player = j.player; renderPlay(); show('play'); $('hint').textContent = 'おかえり、' + player.avatar.name + 'さん！岩をたたいてな'; }
      else playOpening();
    }).catch(function () { $('loadMsg').textContent = 'つながらへんかった。いったん閉じて、もう一回開いてな'; document.querySelector('#load .spin').style.display = 'none'; });
  }
  boot();
})();
</script>
</body>
</html>
