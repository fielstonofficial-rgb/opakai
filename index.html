<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AMONオパール会議室（オパ会）</title>
<meta name="theme-color" content="#0b0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="オパ会">
<style>
:root{
  --bg:#eceef0;--surface:#fff;--surface2:#f3f5f6;--line:#dde1e5;--fg:#14191d;--muted:#5b6670;
  --accent:#0d8576;--accent-ink:#fff;--me:#d3ece8;--me-fg:#0f2a27;
  --furan:#a83a69;--furan-soft:#f6dce8;--aron:#0c7585;--aron-soft:#d2ebef;--danger:#c0392b;
  --opal:linear-gradient(115deg,#9fdcd3,#a9c0f8,#dcb0e6,#f4bccb,#f6d6a4,#9fdcd3);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0d0f;--surface:#14181b;--surface2:#1b2024;--line:#2b3238;--fg:#eef1f3;--muted:#98a3ac;
  --accent:#52d0bd;--accent-ink:#04201c;--me:#17433f;--me-fg:#e2f7f3;
  --furan:#f08fb7;--furan-soft:#3a1d2c;--aron:#62cfe0;--aron-soft:#123640;--danger:#ff7a6b;
  --opal:linear-gradient(115deg,#1f8f84,#3f66c4,#8d4f9c,#b8587c,#b87d36,#1f8f84);}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.65 "Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
header .logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid transparent;background:var(--opal) border-box}
header h1{font-size:15px;margin:0;flex:1;line-height:1.3}
header h1 small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:12px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.row.mine{flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;border:2px solid transparent;background:var(--opal) border-box}
.dot{width:36px;height:36px;border-radius:50%;flex:none;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.col{min-width:0;max-width:78%}
.who{font-size:11px;color:var(--muted);margin:0 4px 2px}
.row.mine .who{text-align:right}
.bubble{padding:8px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.row.mine .bubble{background:var(--me);color:var(--me-fg);border-color:transparent}
.row.furan .bubble{background:var(--furan-soft);border-color:transparent}
.row.aron .bubble{background:var(--aron-soft);border-color:transparent}
.row.furan .who{color:var(--furan)}.row.aron .who{color:var(--aron)}
.notice{align-self:center;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:4px 12px}
.acts{display:none;flex-direction:column;gap:4px;flex:none}
body.admin-on .acts{display:flex}
.mini{font-size:10px;padding:3px 7px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.mini.kick{color:var(--danger);border-color:var(--danger)}
.mini.arm{background:var(--danger);color:#fff}
.typing{font-size:12px;color:var(--muted);padding:0 18px 4px}
form.send{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
form.send input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 16px;outline:none}
form.send input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:700}
.btn:disabled{opacity:.5}
.hint{font-size:11px;color:var(--muted);padding:0 16px 8px;background:var(--surface)}
.card{margin:auto;width:min(92vw,380px);background:var(--surface);border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--opal) border-box;border-radius:20px;padding:22px 20px;text-align:center}
.card h2{margin:6px 0 4px;font-size:17px}
.card p{margin:4px 0 12px;color:var(--muted);font-size:13px}
.card input{width:100%;margin:5px 0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;outline:none;text-align:center}
.card .btn{width:100%;margin-top:8px}
.err{color:var(--danger);font-size:12px;min-height:18px}
.center{flex:1;display:flex;align-items:center;justify-content:center;padding:14px}
.avbig{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid transparent;background:var(--opal) border-box}
#panel{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#panel .sheet{background:var(--surface);width:min(100%,760px);max-height:82dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px}
.sheet h3{margin:4px 0 8px;font-size:15px}
.mrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.mrow b{flex:1;min-width:0;overflow-wrap:anywhere}
.mrow span.st{font-size:11px;color:var(--muted)}
.code{font:700 20px/1.4 ui-monospace,monospace;letter-spacing:.06em;background:var(--surface2);border-radius:12px;padding:10px;text-align:center;user-select:all;margin:6px 0}
.sheet .btn.sm{padding:7px 14px;font-size:13px}
.sheet .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;flex:1;min-width:120px}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 入室 -->
  <div class="center" id="vJoin" hidden>
    <div class="card">
      <img class="avbig" id="imgLogo" alt="">
      <h2>AMONオパール会議室</h2>
      <p>招待制のお部屋です。<br>お渡しした招待コードを入れてな。</p>
      <input id="jCode" placeholder="招待コード（例：OPA-XXXX-XXXX）" autocomplete="off" autocapitalize="characters">
      <input id="jNick" placeholder="ニックネーム（12文字まで）" maxlength="12" autocomplete="off">
      <div class="err" id="jErr"></div>
      <button class="btn" id="jBtn" type="button">入室する</button>
      <p style="margin-top:12px;font-size:11px">機種変更のときは「引き継ぎコード」を入れてな（ニックネームは空でOK）</p>
    </div>
  </div>

  <!-- 退場 -->
  <div class="center" id="vKick" hidden>
    <div class="card">
      <img class="avbig" id="imgAron" alt="">
      <h2 id="kMsg">退場となりました</h2>
      <p>またの機会に、お待ちしています。</p>
    </div>
  </div>

  <!-- チャット -->
  <header id="hd" hidden>
    <img class="logo" id="imgLogo2" alt="">
    <h1>AMONオパール会議室<small id="meLbl"></small></h1>
    <button class="pill" id="btnAdmin" type="button" hidden>管理</button>
    <button class="pill" id="btnDel" type="button" hidden>退場・削除</button>
  </header>
  <div id="log" hidden></div>
  <div class="typing" id="typing" hidden>猫が考え中…😺</div>
  <div class="hint" id="hint" hidden>猫に話しかけるときは「フラン」か「アロン」と名前を入れてな。</div>
  <form class="send" id="form" hidden>
    <input id="msg" placeholder="メッセージを入力" maxlength="300" autocomplete="off">
    <button class="btn" id="sendBtn" type="submit">送信</button>
  </form>
</div>

<div id="panel" hidden><div class="sheet" id="sheet"></div></div>

var $=function(id){return document.getElementById(id)};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},del:function(k){try{localStorage.removeItem(k)}catch(e){}}};
var token=LS.get('opa_token'),me=null,lastSig='',fast=0,timer=null,busy=false;

['imgLogo','imgLogo2'].forEach(function(i){$(i).src=IMG.logo});$('imgAron').src=IMG.aron;

function api(body){
  return fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){j._s=r.status;return j})});
}
function show(v){
  $('vJoin').hidden=v!=='join';$('vKick').hidden=v!=='kick';
  var chat=v==='chat';
  ['hd','log','form','hint'].forEach(function(i){$(i).hidden=!chat});
}

/* 入室 */
$('jBtn').onclick=function(){
  var code=$('jCode').value.trim(),nick=$('jNick').value.trim();
  if(!code){$('jErr').textContent='招待コードを入れてな';return}
  $('jBtn').disabled=true;$('jErr').textContent='';
  api({action:'join',code:code,nickname:nick}).then(function(j){
    $('jBtn').disabled=false;
    if(j.token){token=j.token;LS.set('opa_token',token);start()}
    else $('jErr').textContent=j.message||'入室できませんでした';
  }).catch(function(){$('jBtn').disabled=false;$('jErr').textContent='つながらへんかった。電波を確認してもう一回な'});
};
$('jCode').addEventListener('keydown',function(e){if(e.key==='Enter')$('jBtn').click()});

/* 描画 */
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(msgs){
  var log=$('log');
  var near=log.scrollHeight-log.scrollTop-log.clientHeight<120;
  log.textContent='';
  msgs.forEach(function(m){
    if(m.kind==='notice'){log.appendChild(el('div','notice',m.body));return}
    var isCat=m.kind==='cat';
    var row=el('div','row '+(isCat?m.cat:(m.mine?'mine':'')));
    if(isCat){var a=el('img','av');a.src=IMG[m.cat];a.alt='';row.appendChild(a)}
    else if(!m.mine){row.appendChild(el('div','dot',(m.nick||'?').slice(0,1)))}
    var col=el('div','col');
    col.appendChild(el('div','who',isCat?(m.cat==='aron'?'アロン':'フラン'):m.nick));
    col.appendChild(el('div','bubble',m.body));
    row.appendChild(col);
    if(me&&me.isAdmin&&!isCat&&!m.mine&&m.mid){
      var acts=el('div','acts');
      var k=el('button','mini kick','強制退場');k.type='button';
      k.onclick=function(){
        if(!k.classList.contains('arm')){k.classList.add('arm');k.textContent='もう一度で退場';setTimeout(function(){k.classList.remove('arm');k.textContent='強制退場'},3000);return}
        api({action:'admin_kick',token:token,member_id:m.mid}).then(poll);
      };
      var d=el('button','mini','削除');d.type='button';
      d.onclick=function(){api({action:'admin_delete_msg',token:token,id:m.id}).then(poll)};
      acts.appendChild(k);acts.appendChild(d);row.appendChild(acts);
    } else if(me&&me.isAdmin&&!isCat&&m.mine){
      var acts2=el('div','acts');var d2=el('button','mini','削除');d2.type='button';
      d2.onclick=function(){api({action:'admin_delete_msg',token:token,id:m.id}).then(poll)};
      acts2.appendChild(d2);row.appendChild(acts2);
    } else if(me&&me.isAdmin&&isCat){
      var acts3=el('div','acts');var d3=el('button','mini','削除');d3.type='button';
      d3.onclick=function(){api({action:'admin_delete_msg',token:token,id:m.id}).then(poll)};
      acts3.appendChild(d3);row.appendChild(acts3);
    }
    log.appendChild(row);
  });
  if(near||!lastSig)log.scrollTop=log.scrollHeight;
}

/* 取得（3秒ごと。画面が見えてる間だけ） */
function poll(){
  if(!token||busy)return Promise.resolve();
  busy=true;
  return api({action:'poll',token:token}).then(function(j){
    busy=false;
    if(j.kicked){stopPoll();$('kMsg').textContent='退場となりました';show('kick');return}
    if(j._s===401){stopPoll();LS.del('opa_token');token=null;show('join');return}
    if(!j.msgs)return;
    me=j.me;
    $('meLbl').textContent=me.nickname+(me.isAdmin?'（管理者）':'');
    $('btnAdmin').hidden=!me.isAdmin;$('btnDel').hidden=!me.isAdmin;
    var sig=JSON.stringify(j.msgs.map(function(m){return m.id}));
    var last=j.msgs.length?j.msgs[j.msgs.length-1]:null;
    if(sig!==lastSig){render(j.msgs);lastSig=sig}
    if(last&&last.kind==='cat')$('typing').hidden=true;
  }).catch(function(){busy=false});
}
function loop(){
  clearTimeout(timer);
  if(!token)return;
  var wait=fast>0?1500:3500;if(fast>0)fast--;
  if(fast===0)$('typing').hidden=true;
  timer=setTimeout(function(){(document.hidden?Promise.resolve():poll()).then(loop)},wait);
}
function stopPoll(){clearTimeout(timer);timer=null}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&token){poll()}});

function start(){
  show('chat');lastSig='';poll().then(function(){loop()});
}

/* 発言 */
$('form').onsubmit=function(e){
  e.preventDefault();
  var t=$('msg').value.trim();if(!t)return;
  $('msg').value='';$('sendBtn').disabled=true;
  var wantCat=/アロン|あろん|aron|フラン|ふらん|furan/i.test(t);
  api({action:'say',token:token,text:t}).then(function(j){
    $('sendBtn').disabled=false;
    if(j.kicked){stopPoll();$('kMsg').textContent=(j.reply||'退場となりました').replace(/^【アロン】/,'');show('kick');return}
    if(j.error==='slow'){alert(j.message)}
    if(wantCat){fast=10;$('typing').hidden=false}else fast=2;
    lastSig+='x';poll().then(loop);
  }).catch(function(){$('sendBtn').disabled=false;alert('送れへんかった。もう一回な')});
};

/* 管理パネル */
function esc(s){return s}
function openPanel(){
  var sheet=$('sheet');sheet.textContent='';
  var h=el('h3','','管理');sheet.appendChild(h);
  var btn=el('button','btn sm','新しい招待コードを発行（使い捨て・7日間）');btn.type='button';
  var out=el('div','');
  btn.onclick=function(){
    api({action:'admin_invite',token:token,kind:'new'}).then(function(j){
      out.textContent='';
      if(j.code){out.appendChild(el('div','code',j.code));out.appendChild(el('div','hint','長押しでコピー。お客さん1人に1つ渡してな。'))}
    });
  };
  sheet.appendChild(btn);sheet.appendChild(out);
  sheet.appendChild(el('h3','','会員'));
  var list=el('div','');sheet.appendChild(list);
  var close=el('button','btn sm','閉じる');close.type='button';close.style.marginTop='14px';
  close.onclick=function(){$('panel').hidden=true};sheet.appendChild(close);
  $('panel').hidden=false;
  function load(){
    api({action:'admin_members',token:token}).then(function(j){
      list.textContent='';
      (j.members||[]).forEach(function(m){
        var r=el('div','mrow');
        r.appendChild(el('b','',m.nickname+(m.is_admin?'（管理者）':'')));
        r.appendChild(el('span','st',m.status==='kicked'?'退場中':'参加中'));
        if(!m.is_admin){
          if(m.status==='kicked'){
            var u=el('button','mini','退場を解除');u.type='button';
            u.onclick=function(){api({action:'admin_unkick',token:token,member_id:m.id}).then(function(){load();lastSig='';poll()})};
            r.appendChild(u);
          }else{
            var t=el('button','mini','引き継ぎコード');t.type='button';
            t.onclick=function(){api({action:'admin_invite',token:token,kind:'transfer',member_id:m.id,label:m.nickname}).then(function(x){if(x.code){out.textContent='';out.appendChild(el('div','hint',m.nickname+'さん用の引き継ぎコード（1回だけ使える）'));out.appendChild(el('div','code',x.code))}})};
            r.appendChild(t);
          }
        }
        list.appendChild(r);
      });
      if(j.invites&&j.invites.length){
        list.appendChild(el('h3','','未使用のコード'));
        j.invites.forEach(function(i){var r=el('div','mrow');r.appendChild(el('b','',i.code));r.appendChild(el('span','st',(i.kind==='transfer'?'引き継ぎ ':'')+(i.label||'')));list.appendChild(r)});
      }
    });
  }
  load();
}
$('btnAdmin').onclick=openPanel;
$('panel').addEventListener('click',function(e){if(e.target===$('panel'))$('panel').hidden=true});
$('btnDel').onclick=function(){
  var on=document.body.classList.toggle('admin-on');
  $('btnDel').classList.toggle('on',on);
};

if(token)start();else show('join');
</script>
</body>
